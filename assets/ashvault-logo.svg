<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D89A"/>
      <stop offset="50%" stop-color="#D4A03C"/>
      <stop offset="100%" stop-color="#E8821A"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a2116"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>
  </defs>

  <!-- background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGlow)" stroke="#D4A03C" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- lock shackle -->
  <path d="M46 50 V40 a14 14 0 0 1 28 0 V50"
        fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- lock body -->
  <rect x="36" y="50" width="48" height="38" rx="8" fill="url(#goldGrad)"/>

  <!-- flame cutout inside lock body -->
  <path d="M60 60
           C 56 65, 52 68, 53 74
           C 53.5 79, 58 82, 60 82
           C 62 82, 66.5 79, 67 74
           C 67.5 70, 65 68, 64 71
           C 64 66, 61 63, 60 60 Z"
        fill="#0a0806"/>

  <!-- small keyhole dot -->
  <circle cx="60" cy="78" r="2.2" fill="#0a0806"/>
</svg>
