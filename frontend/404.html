<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Secret Destroyed | AshVault</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: calc(100vh - 200px); padding: 20px; }
    .error-code { font-family: var(--font-display); font-size: clamp(6rem, 15vw, 10rem); font-weight: 700; line-height: 1; color: var(--gold); position: relative; text-shadow: var(--glow-gold); margin-bottom: 10px; animation: flicker 4s infinite; }
    .error-code::after { content: '404'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; color: var(--amber); opacity: 0.5; filter: blur(8px); animation: pulse-gold 2s infinite; }
    .error-title { font-family: var(--font-display); font-size: clamp(1.5rem, 5vw, 2.2rem); color: var(--text-primary); letter-spacing: 0.05em; margin-bottom: 16px; }
    .error-desc { color: var(--text-secondary); max-width: 440px; font-size: 1rem; line-height: 1.6; margin-bottom: 36px; }
    .ash-visual { font-size: 3rem; margin-bottom: 20px; filter: grayscale(0.5); animation: fadeUp 1s ease-out; }
    .back-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 24px; border-radius: var(--radius); backdrop-filter: var(--glass); }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">🔥</div>
      <span class="nav-logo-text">AshVault</span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Create</a></li>
      <li><a href="about.html">How it Works</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
    <div class="nav-actions" id="navActions">
      <a href="login.html" class="btn-nav">Sign In</a>
      <button class="nav-hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main class="page">
    <div class="container-sm">
      <section class="error-page animate-fade-up">
        <div class="ash-visual">⚱️</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Nothing But <span class="text-gold">Ashes</span></h2>
        <p class="error-desc">
          This secret has been <strong>burned on read</strong>, expired, or never existed.
        </p>
        <div class="back-box">
          <p class="form-hint" style="margin-bottom: 16px;">Need to share something securely?</p>
          <div style="display:flex; gap:12px; justify-content:center;">
            <a href="index.html" class="btn btn-primary">Create New Secret</a>
            <a href="about.html" class="btn btn-ghost">Learn More</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2026 Created By: Saubhagya Srivastava <strong style="color:var(--gold-dim);">AshVault</strong> · <a href="about.html">How it Works</a></p>
  </footer>

  <script>
    function handleSignOut() {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    function updateNavbar() {
      const actions = document.querySelector('.nav-actions');
      if (localStorage.getItem('accessToken')) {
        actions.innerHTML = `
          <a href="dashboard.html" class="btn-nav">Dashboard</a>
          <button class="btn-nav btn-nav-filled" onclick="handleSignOut()">Sign Out</button>
          <button class="nav-hamburger" id="hamburger"><span></span><span></span><span></span></button>
        `;
      }
      document.getElementById('hamburger')?.addEventListener('click', () => {
        document.getElementById('navLinks').classList.toggle('open');
      });
    }

    updateNavbar();
  </script>
</body>
</html>
